name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck (server + web), lint, tests + coverage floors, dashboard build
        run: |
          npx tsc --noEmit
          npx tsc -p web --noEmit
          npm run lint --if-present
          npm test -- --coverage
          npm run web:build
      - name: Migration startup smoke test (fresh data dir must reach readiness)
        run: |
          npm run build
          ADMIN_PORT=18999 DATA_DIR=/tmp/ci-smoke-data node dist/main.js &
          SERVER_PID=$!
          sleep 3
          curl -fsS http://127.0.0.1:18999/health/ready > /dev/null
          # Gateways must answer and enforce client-key auth (401 without a key).
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18770/v1beta/models)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18771/v1/models)" = "401"
          kill $SERVER_PID

      - name: End-to-end happy path (setup → provider → group → both gateways)
        run: node scripts/e2e.mjs
