name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck (server + web), lint, tests, dashboard build
        run: |
          npx tsc --noEmit
          npx tsc -p web --noEmit
          npm run lint --if-present
          npm test
          npm run web:build
      - name: Migration startup smoke test (fresh DB must reach readiness)
        run: |
          npm run build
          SETUP_TOKEN=ci-token PORT=18799 DB_PATH=/tmp/ci-smoke.db \
            node dist/main.js &
          SERVER_PID=$!
          sleep 3
          curl -fsS http://127.0.0.1:18799/health/ready > /dev/null
          kill $SERVER_PID
