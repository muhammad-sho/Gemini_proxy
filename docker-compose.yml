# All configuration lives in .env (copy .env.example). This file only wires
# the container: volume, port publishing, and constants that MUST differ
# inside the container. No secrets needed — the admin password is created on
# first open of the dashboard.

services:
  gemini-proxy:
    image: ghcr.io/muhammad-sho/gemini-proxy:latest
    container_name: gemini-proxy
    restart: unless-stopped

    # Forward every variable in .env into the container. Optional, so a bare
    # `docker compose up -d` also works.
    env_file:
      - path: .env
        required: false

    environment:
      # Container constants — these intentionally override .env: Docker can
      # only publish ports to processes bound on 0.0.0.0, so all three
      # surfaces bind every interface HERE; exposure is decided by the
      # host-side address in the `ports` block below. DATA_DIR points the app
      # at the mounted volume.
      NODE_ENV: production
      DATA_DIR: /data
      GATEWAY_HOST: 0.0.0.0
      ADMIN_HOST: 0.0.0.0

    volumes:
      - ./data:/data:Z

    ports:
      # Format: <host-bind>:<host-port>:<container-port>. All surfaces are
      # published on every interface by default; set ADMIN_BIND=127.0.0.1 in
      # .env to keep the dashboard reachable from this machine only (then use
      # an SSH tunnel from elsewhere).
      - "${GATEWAY_BIND:-0.0.0.0}:${GEMINI_PORT:-18770}:${GEMINI_PORT:-18770}"   # Gemini API
      - "${GATEWAY_BIND:-0.0.0.0}:${OPENAI_PORT:-18771}:${OPENAI_PORT:-18771}"   # OpenAI API
      - "${ADMIN_BIND:-0.0.0.0}:${ADMIN_PORT:-18765}:${ADMIN_PORT:-18765}"       # Dashboard/admin

# Backup = back up ./data. It holds the SQLite database and everything else
# the app needs (see README "Backup and migration").
