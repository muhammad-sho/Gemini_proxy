# No configuration required — the app boots on defaults and the admin password
# is created on first open of the dashboard. All data lives in ./data next to
# this file. Runtime behavior (routing, log retention) is tuned in the
# dashboard's Settings tab.

services:
  ai-gate-proxy:
    image: ghcr.io/muhammad-sho/ai-gate-proxy:latest
    container_name: ai-gate-proxy
    restart: unless-stopped
    ports:
      - "18770:18770"   # Gemini-protocol gateway (/v1beta/*)
      - "18771:18771"   # OpenAI-protocol gateway (/v1/models, /v1/chat/completions)
      - "18765:18765"   # Dashboard + admin API (web UI under /)
    volumes:
      - ./data:/data:Z
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      GATEWAY_HOST: 0.0.0.0
      ADMIN_HOST: 0.0.0.0
      # ---- optional overrides (everything else uses built-in defaults) ----
      # LOG_LEVEL: debug       # fatal | error | warn | info | debug | trace
      # TRUST_PROXY: "true"    # behind a reverse proxy that sets X-Forwarded-*
      # HSTS: "true"           # only when the dashboard is served over HTTPS
      # To move a port publicly, change the HOST side of a mapping above,
      # e.g. "8080:18765" serves the dashboard at http://host:8080.

# Backup = back up ./data (stop the container first, or use sqlite3 ".backup").
# See README "Backup and migration".
