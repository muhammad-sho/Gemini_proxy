services:
  gemini-proxy:
    image: ghcr.io/muhammad-sho/gemini-proxy:latest
    container_name: gemini-proxy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "18765:18765"
    volumes:
      - gemini-proxy-data:/data
    environment:
      PORT: 18765
      DB_PATH: /data/gemini-proxy.db
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:18765/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  gemini-proxy-data:
