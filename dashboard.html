<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemini Proxy</title><style>body{font:15px system-ui;margin:32px auto;max-width:1000px;padding:0 18px;background:#f6f7f9;color:#18202a}section{background:white;padding:20px;margin:16px 0;border-radius:10px;box-shadow:0 1px 4px #0001}input,button{padding:9px;margin:4px;border:1px solid #ccd2da;border-radius:6px}button{cursor:pointer;background:#18202a;color:white}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #e8ebef}.muted{color:#697586}.danger{color:#a32222}</style></head><body><h1>Gemini Proxy</h1><section><h2>Client API keys</h2><form id="clientKeyForm"><input name="label" placeholder="Label" required><button>Generate client key</button></form><table id="clientKeys"></table><p class="muted">Client keys authenticate n8n to this proxy. The full value is shown only when generated.</p></section><p class="muted">Keys are shared across all enabled models. Limits are rolling requests per minute/day; 0 means unlimited.</p><section><h2>API keys</h2><form id="keyForm"><input name="label" placeholder="Label" required><input name="key" placeholder="Gemini API key" required size="35"><button>Add key</button></form><table id="keys"></table></section><section><h2>Models</h2><form id="modelForm"><input name="name" placeholder="Model name" required><input name="rpm" type="number" min="0" placeholder="RPM (0 = unlimited)"><input name="rpd" type="number" min="0" placeholder="RPD (0 = unlimited)"><input name="cooldown" type="number" min="0" placeholder="Cooldown seconds"><button>Add model</button></form><table id="models"></table></section><section><h2>Usage today</h2><p id="reset" class="muted"></p><table id="usage"></table></section><script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function csrf(){return document.cookie.match(/(?:^|; )gemini_csrf=([^;]+)/)?.[1]||''}async function api(u,o={}){let headers={'Content-Type':'application/json','X-CSRF-Token':csrf(),...(o.headers||{})};let r=await fetch(u,{...o,headers});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){let d=await api('/api/admin/state');document.querySelector('#clientKeys').innerHTML='<tr><th>Label</th><th>Key</th><th>Status</th><th></th></tr>'+d.clientKeys.map(k=>`<tr><td>${esc(k.label)}</td><td>${esc(k.masked)}</td><td>${k.enabled?'Enabled':'Disabled'}</td><td><button onclick="toggleClientKey(${k.id},${!k.enabled})">${k.enabled?'Disable':'Enable'}</button><button onclick="deleteClientKey(${k.id})">Delete</button></td></tr>`).join('');document.querySelector('#reset').textContent='Google daily window resets at midnight Pacific Time ('+d.resetTimezone+'). Current window began '+new Date(d.resetAt).toLocaleString();document.querySelector('#usage').innerHTML='<tr><th>Model</th><th>Key</th><th>Requests today</th><th>Last request</th></tr>'+d.usage.map(u=>`<tr><td>${esc(u.model)}</td><td>${esc(u.label)} (${esc(u.masked)})</td><td>${u.today}</td><td>${u.last_request?new Date(u.last_request).toLocaleString():'-'}</td></tr>`).join('')||'<tr><td colspan="4">No requests in the current daily window.</td></tr>';document.querySelector('#keys').innerHTML='<tr><th>Label</th><th>Key</th><th>Status</th><th></th></tr>'+d.keys.map(k=>`<tr><td>${esc(k.label)}</td><td>${esc(k.masked)}</td><td>${k.enabled?'Enabled':'Disabled'}</td><td><button onclick="toggleKey(${k.id},${!k.enabled})">${k.enabled?'Disable':'Enable'}</button><button onclick="deleteKey(${k.id})">Delete</button></td></tr>`).join('');document.querySelector('#models').innerHTML='<tr><th>Model</th><th>Limits</th><th>Usage</th><th>Status</th><th></th></tr>'+d.models.map(m=>`<tr><td>${esc(m.name)}</td><td>${m.rpm_limit||'∞'} / min, ${m.rpd_limit||'∞'} / day</td><td>${m.minute} / ${m.day} (cooldown ${m.cooldown_seconds||0}s)</td><td>${m.enabled?'Enabled':'Disabled'}</td><td><button onclick="toggleModel('${encodeURIComponent(m.name)}',${!m.enabled})">${m.enabled?'Disable':'Enable'}</button><button onclick="deleteModel('${encodeURIComponent(m.name)}')">Delete</button></td></tr>`).join('')}document.querySelector('#clientKeyForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let d=await api('/api/admin/client-keys',{method:'POST',body:JSON.stringify({label:f.get('label')})});alert('Save this client key now:\n\n'+d.clientApiKey);e.target.reset();load()};document.querySelector('#keyForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await api('/api/admin/keys',{method:'POST',body:JSON.stringify({label:f.get('label'),key:f.get('key')})});e.target.reset();load()}catch(x){alert(x.message)}};document.querySelector('#modelForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await api('/api/admin/models',{method:'POST',body:JSON.stringify({name:f.get('name'),rpm:Number(f.get('rpm')||0),rpd:Number(f.get('rpd')||0),cooldown:Number(f.get('cooldown')||0)})});e.target.reset();load()}catch(x){alert(x.message)}};async function toggleClientKey(id,enabled){await api('/api/admin/client-keys/'+id,{method:'PATCH',body:JSON.stringify({enabled})});load()}async function deleteClientKey(id){if(confirm('Delete this client key?')){await api('/api/admin/client-keys/'+id,{method:'DELETE'});load()}}async function toggleKey(id,enabled){await api('/api/admin/keys/'+id,{method:'PATCH',body:JSON.stringify({enabled})});load()}async function toggleModel(name,enabled){await api('/api/admin/models/'+name,{method:'PATCH',body:JSON.stringify({enabled})});load()}async function deleteKey(id){if(confirm('Delete this API key?')){await api('/api/admin/keys/'+id,{method:'DELETE'});load()}}async function deleteModel(name){if(confirm('Delete this model?')){await api('/api/admin/models/'+name,{method:'DELETE'});load()}}load();setInterval(load,10000)</script></body></html>
